[workspace]
resolver = "3"
members = ["crates/ring", "crates/proto", "crates/driver", "crates/daemon", "crates/ctl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
spool-ring = { path = "crates/ring" }
spool-proto = { path = "crates/proto" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
cpal = "0.18"
rtrb = "0.4"

[profile.release]
# The driver runs inside coreaudiod: a panic must never unwind into C.
# Every extern "C" entry point also has a catch_unwind guard (see driver/src/lib.rs).
panic = "abort"
lto = true
codegen-units = 1
